<style>
:root{color-scheme:dark;--bg:#000;--s:#0b080e;--e:#130d19;--b:#2a1b36;--pv:#f0abfc;--soft:#d8b4fe;--mute:#9f75b0;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--pv);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:28px 16px 60px;display:flex;flex-direction:column;gap:18px}

button{font:inherit;cursor:pointer;color:var(--soft);background:none;border:1px solid #4a2a5e;border-radius:99px;padding:6px 12px;font-size:12px}

.dh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:22px 2px 2px}

.dh:first-child{padding-top:2px}
.dh+.rw{border-top:0}
.more{align-self:center;margin:10px 0;font-size:20px;padding:6px 24px}
#rvl{display:flex;flex-direction:column;overflow-y:auto;max-height:46vh;border-top:1px solid #1d1226}
.rvr{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid #1d1226;cursor:pointer;margin:0;font-size:inherit}

.hint{font-size:12px;color:var(--mute);margin-top:4px}
</style>

<main>
  <header>
    <h1>Am I Free?</h1>
    <button id="mg">Upload file</button>
  </header>

  <form id="qf" autocomplete="off">
    <input id="q" type="text" placeholder="m, t, 14th, sat eve, fri 7pm…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
  </form>

      <div><div id="vt"></div><div class="mute" id="vs"></div><div id="clash"></div></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='am_i_free_v5';
const LIM=10;
/*@h0*/
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=s=>{const a=s.split(':').map(Number);return a[0]*60+a[1]};
const hhmm=m=>{m=Math.max(0,Math.min(1439,m));return pad(m/60|0)+':'+pad(m%60)};
const t12=s=>{const a=s.split(':').map(Number);return (a[0]%12||12)+(a[1]?':'+pad(a[1]):'')+(a[0]>=12?' PM':' AM')};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
/*@h1*/
const dd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'e'+Math.random().toString(36).slice(2,9);

const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WD=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const PARTS={morning:[360,720],afternoon:[720,1020],evening:[1020,1260],night:[1260,1439]};
const VOCAB=['tomorrow','today','tonight','next'].concat(WD,Object.keys(PARTS));
const isDay=w=>DAYS.includes(w);

let events=[];
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.events))events=r.events}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({events}))}catch(e){}};
function toast(m,keep){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);if(!keep)toast.h=setTimeout(()=>t.classList.remove('on'),3200)}

/* ---------- autocomplete ---------- */
const KIND=w=>/^(today|tomorrow|tonight)$/.test(w)||isDay(w)||/^\d{1,2}(st|nd|rd|th)?$/.test(w)?'day':PARTS[w]?'part':w==='next'?'next':'';
const words=t=>t.toLowerCase().split(/\s+/).filter(Boolean);
function ctx(){
  const q=$('q'),v=q.value,ss=q.selectionStart==null?v.length:q.selectionStart,se=q.selectionEnd==null?ss:q.selectionEnd;
  let a,b,partial='';
  if(se>ss){a=ss;b=se}
  else{
    a=v.lastIndexOf(' ',ss-1)+1;
    const nb=v.indexOf(' ',ss);b=nb<0?v.length:nb;
    const cur=v.slice(a,ss).toLowerCase();
    if(cur&&/^[a-z]+$/.test(cur)&&/^[a-z]*$/.test(v.slice(ss,b).toLowerCase()))partial=cur;else{a=ss;b=ss}
  }
  return {a:a,b:b,partial:partial,before:words(v.slice(0,a)),after:words(v.slice(b))};
}
function suggest(){
  const c=ctx(),all=c.before.concat(c.after),prev=c.before[c.before.length-1];
  const hasDay=all.some(w=>KIND(expand(w))==='day');
  const dflt=prev==='next'?WD.slice():hasDay?Object.keys(PARTS).concat(WD):['today','tomorrow','next'].concat(WD);
  let list=dflt,matched=false;
  if(c.partial){
    let m=VOCAB.filter(w=>w.startsWith(c.partial));
    if(prev==='next')m=m.filter(isDay);
    if(m.length){matched=true;list=VOCAB.includes(c.partial)?m.concat(dflt.filter(w=>!m.includes(w))):m}
  }
  return {list:list.slice(0,10),partial:c.partial,matched:matched};
}
function accept(word){
  const q=$('q'),c=ctx(),k=KIND(word);
  const keep=t=>{const tk=KIND(expand(t));if(k==='next')return tk!=='next';if(tk===k)return false;if(tk==='next'&&k==='day'&&!isDay(word))return false;return true};
  const pre=c.before.filter(keep).concat(word).join(' ')+' ';
  q.value=pre+c.after.filter(keep).join(' ');
  q.focus();q.setSelectionRange(pre.length,pre.length);update();
}
function drawSugg(){
  const r=suggest(),box=$('sugg');
  box.innerHTML='';
  r.list.forEach(w=>{const b=document.createElement('button');b.type='button';b.textContent=w;b.addEventListener('click',()=>accept(w));box.appendChild(b)});
  box.classList.toggle('hide',!r.list.length);
  return r;
}

/* ---------- parser ---------- */
function expand(text){
  return text.toLowerCase().split(/\s+/).filter(Boolean).map(t=>{
    if(t==='tmrw'||t==='tmr')return 'tomorrow';
    if(/^[a-z]+$/.test(t)&&!VOCAB.includes(t)){const m=VOCAB.find(w=>w.startsWith(t));return m||t}
    return t;
  }).join(' ');
}
function nt(h,m,ap){h=+h;m=+(m||0);if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return hhmm(h*60+m)}
function parse(text){
  let t=expand(text);
  if(!t.trim())return null;
  const now=new Date();let start=null,end=null,part=null;
  let m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(m&&(m[2]||m[3]||m[5]||m[6])){
    start=nt(m[1],m[2],m[3]||m[6]);end=nt(m[4],m[5],m[6]);
    if(mins(end)<=mins(start))end=hhmm(mins(start)+60);
    t=t.replace(m[0],' ');
  }else{
    m=t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/)||t.match(/\b(\d{1,2}):(\d{2})\b()/);
    if(m){start=nt(m[1],m[2],m[3]||'');end=hhmm(mins(start)+60);t=t.replace(m[0],' ')}
  }
  let date=null;
  const im=t.match(/\b(\d{4}-\d{2}-\d{2})\b/);
  const om=t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\b/);
  if(im)date=im[1];
  else if(om&&+om[1]>=1&&+om[1]<=31){
    for(let i=0;i<62;i++){const d=addD(now,i);if(d.getDate()===+om[1]){date=iso(d);break}}
  }else if(/\btomorrow\b/.test(t))date=iso(addD(now,1));
  else if(/\b(today|tonight)\b/.test(t))date=iso(now);
  else{
    const w=t.split(/\s+/).find(isDay);
    if(w){let diff=(DAYS.indexOf(w)-now.getDay()+7)%7;if(diff===0)diff=7;date=iso(addD(now,diff))}
  }
  if(/\btonight\b/.test(t))part='night';
  Object.keys(PARTS).forEach(p=>{if(new RegExp('\\b'+p+'\\b').test(t))part=p});
  if(!date){
    if(start||part)date=iso(now);else return null;
  }
  let name,all=false;
  if(start){name=t12(start)+' – '+t12(end)}
  else if(part){start=hhmm(PARTS[part][0]);end=hhmm(PARTS[part][1]);name=part[0].toUpperCase()+part.slice(1)}
  else{start='07:00';end='23:00';name='All day';all=true}
  return {date,start,end,name,all};
}

/* ---------- logic ---------- */
const eff=e=>({s:mins(e.start)-(e.prep||0)-(e.travel||0),e:mins(e.end)+(e.overflow||0)});
function overlaps(date,ws,we){
  const direct=[],buf=[];
  events.filter(e=>e.date===date).forEach(e=>{
    const s=mins(e.start),en=mins(e.end),f=eff(e);
    if(ws<en&&s<we)direct.push(e);else if(ws<f.e&&f.s<we)buf.push(e);
  });
  return {direct,buf};
}
function gaps(date,ws,we){
  const busy=events.filter(e=>e.date===date).map(eff).sort((a,b)=>a.s-b.s);
  const out=[];let cur=ws;
  busy.forEach(b=>{if(b.s>cur&&b.s-cur>=30)out.push([cur,Math.min(b.s,we)]);cur=Math.max(cur,b.e)});
  if(we-cur>=30&&cur<we)out.push([cur,we]);
  return out.filter(g=>g[0]<we&&g[1]>ws).map(g=>[Math.max(g[0],ws),Math.min(g[1],we)]);
}

let P=parse('today'),opts={travel:0,prep:0,overflow:0},optOpen=false,showAll=false;

function render(){
  const ws=mins(P.start),we=mins(P.end);
  const {direct,buf}=overlaps(P.date,ws,we);
  if(direct.length){
    $('vt').textContent='Not free';$('vt').style.color='var(--bad)';
    $('vs').textContent=dd(P.date)+' · '+P.name;
    $('book').textContent='Book anyway';
  }else if(buf.length){
    $('vt').textContent='Free';$('vt').style.color='var(--warn)';
    $('vs').innerHTML=esc(dd(P.date))+' · '+esc(P.name)+'<br>Prep, travel or overflow for '+buf.map(e=>'“'+esc(e.title)+'”').join(', ')+' touches this.';
    $('book').textContent='Book';
  }else{
    $('vt').textContent='Free';$('vt').style.color='var(--ok)';
    $('vs').textContent=dd(P.date)+' · '+P.name+(P.all?'':' ('+t12(P.start)+' – '+t12(P.end)+')');
    $('book').textContent='Book';
  }
  const g=gaps(P.date,ws,we);
  $('clash').innerHTML='';
  direct.forEach(e=>{const r=document.createElement('div');r.className='cl';r.innerHTML='<span>'+esc(e.title)+' · '+t12(e.start)+'–'+t12(e.end)+'</span>';const b=document.createElement('button');b.className='lnk';b.textContent='Move';b.addEventListener('click',()=>openMove(e));r.appendChild(b);$('clash').appendChild(r)});
  $('gaps').textContent=g.length&&(direct.length||buf.length||P.all)?'Free '+g.map(x=>t12(hhmm(x[0]))+'–'+t12(hhmm(x[1]))).join(', '):'';
  const n=events.length;$('rc').textContent=n+(n===1?' plan':' plans');
  drawTimeline(ws,we,direct,buf);
  if(optOpen)impact();
}
function evRow(e,st,lit){
  const x=[];if(e.prep)x.push(e.prep+'m prep');if(e.travel)x.push(e.travel+'m travel');if(e.overflow)x.push(e.overflow+'m overflow');
  const r=document.createElement('div');r.className='rw'+(lit?'':' dim');
  r.innerHTML='<div class="rr"><span class="tm">'+t12(e.start)+'</span><span class="ti">'+esc(e.title)+'</span>'+(st?'<i class="d '+st+'"></i>':'')+'</div><div class="act hide"><span>'+(x.join(' · ')||t12(e.start)+' – '+t12(e.end))+'</span></div>';
  const a=r.querySelector('.act');
  const mv=document.createElement('button');mv.className='lnk';mv.textContent='Move';
  mv.addEventListener('click',ev=>{ev.stopPropagation();openMove(e)});
  const rm=document.createElement('button');rm.className='lnk';rm.textContent='Remove';
  rm.addEventListener('click',ev=>{ev.stopPropagation();events=events.filter(z=>z.id!==e.id);save();render();toast('Removed')});
  a.appendChild(mv);a.appendChild(rm);
  r.addEventListener('click',()=>a.classList.toggle('hide'));
  return r;
}
const dl=d=>{const t=new Date();if(d===iso(t))return 'Today';if(d===iso(addD(t,1)))return 'Tomorrow';const a=d.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:a[0]===t.getFullYear()?undefined:'numeric'})};

  const TM=/\d{1,2}:\d{2}\s?[AP]M/gi;
  const to24=s=>{const m=s.match(/(\d{1,2}):(\d{2})\s?([AP]M)/i);let h=+m[1];const ap=m[3].toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;return String(h).padStart(2,'0')+':'+m[2]};
  const all=items.map(i=>({s:String(i.str||i.s||'').trim(),x:i.x!=null?i.x:i.transform[4],y:i.y!=null?i.y:i.transform[5],w:i.w!=null?i.w:(i.width||0)})).filter(i=>i.s);
  const dm=all.map(i=>i.s).join(' ').match(/(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s*(\d{4})/i);
  if(!dm)return [];
  const date=new Date(dm[1]+' '+dm[2]+', '+dm[3]);
  const isoD=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
  const toks=r=>{const out=[];all.filter(i=>Math.abs(i.y-r)<4&&i.x>250).forEach(i=>{let m;TM.lastIndex=0;while((m=TM.exec(i.s))){out.push({t:to24(m[0]),x:i.x+i.w*((m.index+m[0].length/2)/i.s.length)})}});return out};
  const times=all.filter(i=>i.s==='Time'&&i.x<260&&i.x>200);
  const rooms=all.filter(i=>i.s==='Room'&&i.x<260&&i.x>200);
  const out=[];
  const doubtHdr=all.find(i=>i.s==='Start Time');
  const hit=i=>i.s.toLowerCase().split(/[\s,\/]+/).includes(f)||i.s.toLowerCase()===f;
  const facY=(all.find(i=>i.s==='Faculty'&&i.x<290)||{y:-1e9}).y;
  const hits=all.filter(hit).filter(h=>(doubtHdr&&h.y<doubtHdr.y)||h.y>facY+4);
  hits.forEach(h=>{
    if(doubtHdr&&h.y<doubtHdr.y){
      const st=all.filter(i=>i.x>150&&i.x<225&&/^\d{1,2}:\d{2}\s?[AP]M$/i.test(i.s)&&i.y<doubtHdr.y).sort((a,b)=>b.y-a.y);
      let pick=null,bd=1e9;st.forEach((s,k)=>{const nxt=st[k+1];const bottom=nxt?nxt.y+(s.y-nxt.y)/2:s.y-60;const top=k?s.y+(st[k-1].y-s.y)/2:s.y+60;if(h.y<=top&&h.y>=bottom){const d=Math.abs(h.y-s.y);if(d<bd){bd=d;pick=s}}});
      if(!pick)return;
      const en=all.find(i=>i.x>=225&&i.x<290&&Math.abs(i.y-pick.y)<4&&/^\d{1,2}:\d{2}\s?[AP]M$/i.test(i.s));
      if(!en)return;
      out.push({title:'Doubt session',date:isoD,start:to24(pick.s),end:to24(en.s)});
      return;
    }
    const tr=times.filter(t=>t.y>h.y).sort((a,b)=>a.y-b.y)[0];
    if(!tr)return;
    const rr=rooms.filter(r=>r.y<tr.y&&r.y>tr.y-25).sort((a,b)=>b.y-a.y)[0];
    if(!rr)return;
    const ts=toks(tr.y),te=toks(rr.y);
    const cx=h.x+h.w/2;
    const s=ts.slice().sort((a,b)=>Math.abs(a.x-cx)-Math.abs(b.x-cx))[0];
    if(!s)return;
    const e=te.slice().sort((a,b)=>Math.abs(a.x-s.x)-Math.abs(b.x-s.x))[0];
    if(!e)return;
    const row=all.filter(i=>Math.abs(i.y-h.y)<4&&i.x<260&&i!==h).sort((a,b)=>a.x-b.x).map(i=>i.s);
    out.push({title:row.join(' · ')||'Class',date:isoD,start:s.t,end:e.t});
  });
  return out.filter((e,i,a)=>a.findIndex(z=>z.start===e.start&&z.end===e.end&&z.title===e.title)===i);
}

/* Try every local reader on a PDF before asking AI */
function localPdf(pages,filter){
  const all=[].concat(...pages.map(p=>p.items));
  let r=[];
  if(filter&&looksFacultyGrid(all))r=[].concat(...pages.slice(0,10).map(p=>recipeFacultyGrid(p.items,filter)));
  if(r.length)return r;
  r=parseTextLines([].concat(...pages.map(p=>itemsToLines(p.items))),{filter:filter});
  if(r.length)return r;
  if(filter)r=[].concat(...pages.map(p=>parseGrid(p.items,filter)));
  return r;
}

const shrink=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};im.onerror=no;im.src=u});
const readText=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=no;r.readAsText(f)});

let sampler=null;
async function getSampler(){
  if(sampler)return sampler;
  try{sampler=await claude.use('sample')}catch(e){sampler=null}
  return sampler;
}
async function ai(text,blobs){
  const FILTER=($('flt').value||'').trim().replace(/["\\]/g,'');
  const prompt='Today is '+iso(new Date())+'. Read this schedule (timetable, calendar, itinerary, shifts, invitation or notes) and extract every event. Return ONLY a JSON array, no prose and no code fences. Each item: {"title":string,"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM"} in 24-hour time. Infer missing years from today (use the next upcoming occurrence). If no end time is given use start plus 60 minutes. If there is no time, use 09:00-10:00. For weekly or repeating timetables, expand them into the next 4 weeks of dates. Put the room, batch or location in the title when shown.'
    +(FILTER?' ONLY include events that involve or belong to this filter (a person, faculty code, batch, room or keyword): "'+FILTER+'". Match it against every cell of the grid and use the column header above each cell for its time. Ignore everything else. If nothing matches return [].':'')
    +(text?'\n\nSchedule text (an attached image, if any, shows the true layout, so trust it for columns):\n'+text.slice(0,60000):'');
  const s=await getSampler();
  if(!s)throw new Error('ai');
  const lim=await s.limits().catch(()=>null),opt={modelTier:'default'};
  if(blobs&&blobs.length){const L=lim&&lim.images;if(!L)throw new Error('type');opt.images=blobs.slice(0,L.maxCount||4)}
  const out=(await s(prompt,opt)).text;
  const m=String(out||'').match(/\[[\s\S]*\]/);
  return m?JSON.parse(m[0]):[];
}
function loadPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function readPdf(file){
  await loadPdfJs();
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=Math.min(doc.numPages,20);i++){
    const pg=await doc.getPage(i);
    pages.push({pg:pg,items:(await pg.getTextContent()).items});
  }
  return pages;
}
async function aiPdf(pages){
  if(!(await getSampler()))throw new Error('ai');
  const imgs=[];let txt='';
  for(const p of pages){
    txt+=itemsToLines(p.items).join('\n')+'\n';
    if(imgs.length<6){
      const vp=p.pg.getViewport({scale:1.6}),c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;
      await p.pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)));
    }
  }
  return ai(txt,imgs);
}

async function scan(file,forceAi){
  lastFile=file;
  $('um').classList.add('hide');toast('Reading…',true);
  try{
    const name=file.name.toLowerCase(),filter=($('flt').value||'').trim();
    const isPdf=file.type==='application/pdf'||/\.pdf$/.test(name);
    const isText=!isPdf&&(file.type.startsWith('text/')||/\.(txt|ics|csv|tsv|md)$/.test(name));
    let raw=[],exact=false,viaAi=false;
    if(isText){
      const t=await readText(file);
      if(!forceAi){
        if(/BEGIN:VEVENT/.test(t)){raw=parseIcs(t,filter);exact=true}
        else{
          const c=parseCsv(t,filter);
          if(c){raw=c;exact=true}
          else raw=parseTextLines(t.split(/\r?\n/),{filter:filter,assumeToday:true});
        }
      }
      if(!raw.length&&!(exact&&!forceAi)){raw=await ai(t,null);viaAi=true;exact=false}
    }else if(isPdf){
      const pages=await readPdf(file);
      if(!forceAi)raw=localPdf(pages,filter);
      if(!raw.length){raw=await aiPdf(pages);viaAi=true}
    }else{
      raw=await ai('',[await shrink(file)]);viaAi=true;
    }
    const tm=/^\d{2}:\d{2}$/,todayS=iso(new Date());
    let past=0,dup=0;const seen=new Set(),items=[];
    (raw||[]).forEach(e=>{
      if(!e||!e.title||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!tm.test(e.start)||!tm.test(e.end)||mins(e.end)<=mins(e.start))return;
      if(e.date<todayS){past++;return}
      if(events.some(x=>x.date===e.date&&x.start===e.start&&x.end===e.end)){dup++;return}
      const k=e.date+e.start+e.end+String(e.title).toLowerCase();
      if(seen.has(k))return;seen.add(k);
      items.push({id:uid(),title:String(e.title).slice(0,80),date:e.date,start:e.start,end:e.end,prep:0,travel:0,overflow:0});
    });
    if(items.length>400)items.length=400;
    const note=[past?past+' past skipped':'',dup?dup+' already added':''].filter(Boolean).join(', ');
    if(!items.length){
      toast(raw&&raw.length?'Nothing new to add'+(note?' ('+note+')':''):'No plans found'+(filter?' for “'+filter+'”':'')+'. Try a clearer file or paste the text.');
      return;
    }
    $('toast').classList.remove('on');
    if(exact)commit(items,note);else openReview(items,viaAi,note);
  }catch(e){
    const c=e&&e.code;
    if(e&&e.message==='ai'){$('toast').classList.remove('on');$('um').classList.remove('hide');$('nc').style.display='flex';return}
    toast(c==='not_granted'?'AI reading needs you signed in to Claude':e&&e.message==='type'?'That file type can’t be read — try a photo':c==='rate_limited'?'Too many tries — wait a moment':'Couldn’t read that file');
  }
}
